name: Release & Publish Packages

# Flow on every push to main:
#   1. If changesets are pending: version packages, then commit and push the
#      version bump. A failed push stops the run before anything is published.
#   2. Build and run `changeset publish`, which only publishes versions not yet
#      on npm. This is a no-op when nothing is new, and it retries any earlier
#      publish that failed after its version bump was pushed.
# workflow_dispatch re-runs the same flow (e.g. to retry a failed publish).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once; queue rather than cancel a release mid-publish
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Version & Publish Packages to NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'slopmachine-dev'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for pending changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          echo "Pending changesets: $CHANGESETS"

      - name: Version packages & update CHANGELOG.md files
        if: steps.changeset_check.outputs.count > 0
        run: npm run version-packages

      # Push the version bump before publishing so npm can never get ahead of git.
      # If main moved since checkout, the push fails and nothing is published;
      # the next push to main picks up the still-pending changesets.
      - name: Commit & push version bumps and changelogs
        if: steps.changeset_check.outputs.count > 0
        run: |
          git add .changeset packages
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): version packages and update changelogs [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build packages
        run: npm run build:packages

      - name: Publish unpublished versions to NPM
        run: npx changeset publish

      - name: Push release tags
        run: git push origin --tags
