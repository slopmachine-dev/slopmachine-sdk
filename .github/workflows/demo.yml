name: Deploy Demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deploys to Cloudflare Pages via wrangler; no GitHub Pages permissions needed
permissions:
  contents: read

concurrency:
  group: "deploy-demo"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build Demo
        run: |
          npm run build:packages
          npm run docs:build
          npm run build:react
          npm run build:svelte
          mkdir -p dist-demo/demo-react dist-demo/demo-svelte
          cp -a apps/docs/.vitepress/dist/. dist-demo/
          cp -a apps/demo-react/dist/. dist-demo/demo-react/
          cp -a apps/demo-svelte/dist/. dist-demo/demo-svelte/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-demo --project-name="slopmachine-docs"
