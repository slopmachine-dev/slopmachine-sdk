name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the changeset check can diff against origin/main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails only if a publishable package changed without a changeset in this PR.
      # Docs/demo/CI-only PRs pass; use `npx changeset add --empty` to opt out explicitly.
      - name: Check for changeset on PRs
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: npx changeset status --since=origin/${{ github.base_ref }}

      - name: Build all workspace packages
        run: npm run build

      # Runs after the build: react/svelte type-check against core's emitted .d.ts
      - name: Type-check packages (tsc + svelte-check)
        run: npm run typecheck

      - name: Run tests
        run: npm test

  swift:
    name: Swift Package Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'packages/swift/Sources/SlopMachine/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run SlopMachine Swift Tests
        run: swift test

      - name: Build for iOS Simulator
        run: xcodebuild -scheme SlopMachine -destination 'generic/platform=iOS Simulator' build
