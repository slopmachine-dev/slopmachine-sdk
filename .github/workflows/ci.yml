name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the changeset check can diff against origin/main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails only if a publishable package changed without a changeset in this PR.
      # Docs/demo/CI-only PRs pass; use `npx changeset add --empty` to opt out explicitly.
      - name: Check for changeset on PRs
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: npx changeset status --since=origin/${{ github.base_ref }}

      - name: Build all workspace packages
        run: npm run build

      # Runs after the build: react/svelte type-check against core's emitted .d.ts
      - name: Type-check packages (tsc + svelte-check)
        run: npm run typecheck

      - name: Run tests
        run: npm test
