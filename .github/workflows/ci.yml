name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Build (Node 24)
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      swift_changed: ${{ steps.swift_diff.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the changeset check can diff against origin/main
          fetch-depth: 0

      - name: Detect Swift changes
        id: swift_diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- Package.swift 'packages/swift/**' .github/workflows/ci.yml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # On the self-hosted runner this would upload the developer's whole ~/.npm; it persists locally anyway.
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      # Fails only if a publishable package changed without a changeset in this PR.
      # Docs/demo/CI-only PRs pass; use `npx changeset add --empty` to opt out explicitly.
      - name: Check for changeset on PRs
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: npx changeset status --since=origin/${{ github.base_ref }}

      - name: Build all workspace packages
        run: npm run build

      # Runs after the build: react/svelte type-check against core's emitted .d.ts
      - name: Type-check packages (tsc + svelte-check)
        run: npm run typecheck

      - name: Run tests
        run: npm test

  swift:
    name: Swift Package Tests (macOS)
    needs: test
    if: needs.test.outputs.swift_changed == 'true'
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'true' && 'self-hosted' || 'macos-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache SwiftPM build
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'packages/swift/Sources/SlopMachine/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run SlopMachine Swift Tests
        run: |
          BUILD_PATH="${{ runner.environment == 'self-hosted' && '/tmp/slopmachine-sdk-spm-build' || '.build' }}"
          swift test --build-path "$BUILD_PATH"
